<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARN Digital</title>
<style>
:root{--bg:#f3f5fb;--pn:#fff;--p2:#eef1f9;--tx:#0a1330;--mu:#5d6887;--bd:#dde3f1;--ac:#2563ff;--a2:#6d5dfc;--ok:#12a150;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060b1c;--pn:#0d1631;--p2:#131f40;--tx:#e9eefc;--mu:#8e9bbf;--bd:#1d2b55;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#060b1c;--pn:#0d1631;--p2:#131f40;--tx:#e9eefc;--mu:#8e9bbf;--bd:#1d2b55;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--bd);background:var(--pn);gap:10px;flex-wrap:wrap}
.lg{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px}.lg i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--a2));display:grid;place-items:center;color:#fff;font-style:normal}
.wrap{max-width:1000px;margin:0 auto;padding:24px 18px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px #0a13300f}
input,textarea{width:100%;background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--ac)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
.btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--ac),var(--a2));text-decoration:none;display:inline-block}
.btn.g{background:var(--p2);color:var(--tx);border:1px solid var(--bd)}.btn:disabled{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}.stats .card{margin:0}.n{font-size:30px;font-weight:750}.lb{color:var(--mu);font-size:13px}
.si{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.si img,.ph{width:84px;height:54px;object-fit:cover;border-radius:8px;flex:none;background:linear-gradient(135deg,var(--ac),var(--a2))}.si div{flex:1;min-width:0}
.badge{background:#e5484d;color:#fff;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700}
.gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#1d3fd655,transparent 50%),var(--bg)}.gate .card{width:min(400px,100%);text-align:center}
.show{position:fixed;inset:0;background:#050a1a;color:#fff;overflow:hidden;z-index:5}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:7vh 6vw calc(9vh + env(safe-area-inset-bottom,0px));opacity:0;transition:opacity .8s;background-size:cover;background-position:center}
.sl{pointer-events:none}.sl.on{opacity:1;pointer-events:auto;z-index:1}.sl::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#050a1a33,#050a1aee 75%)}.sl>*{position:relative;max-width:720px}
.sl h2{font-size:clamp(28px,5vw,52px);margin:0 0 8px;letter-spacing:-1px}.sl p{opacity:.85;margin:0 0 18px;font-size:clamp(15px,2vw,19px)}
.ctl{position:absolute;bottom:calc(2.5vh + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px;align-items:center;z-index:6}
.dt{width:9px;height:9px;border-radius:50%;background:#ffffff55;border:0;padding:0;cursor:pointer}.dt.on{background:#fff;width:24px;border-radius:9px}
.nb{background:#ffffff22;color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}
.hd{position:absolute;top:calc(2vh + env(safe-area-inset-top,0px));left:5vw;right:5vw;display:flex;justify-content:space-between;z-index:6;align-items:center}
.toast{position:fixed;top:16px;right:16px;background:#0a1330;color:#fff;padding:12px 18px;border-radius:12px;z-index:50;border:1px solid #2563ff}
</style></head><body><div id="app"></div>
<div id="app"></div>
<script type="application/json" id="data">{"sites":[{"title":"QUIKO","url":"https://quiko.pages.dev/","desc":"","img":""},{"title":"AAVNI DENTAL CLINIC","url":"https://abiram2427.github.io/AAVNI-DENTAL-CLINIC/","desc":"","img":""},{"title":"YUM YUM TREE","url":"https://yumyumtree.pages.dev/","desc":"","img":""}],"salt":"b8b67529-f5e2-4f89-b51b-cb9ac65b6a02","hash":"05aa891c2dd20a831aee21d094904dba9ebff1caa2939b2e03d71f1303152180"}</script>
<script>
const $=i=>document.getElementById(i),e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let DATA={sites:[],salt:"",hash:""};try{DATA=JSON.parse($("data").textContent)}catch(x){}
let DB,U,AS,AR,RM,admin=false,idx=0,timer=null,paused=false,live=0,total=0,fresh=0,baseline=true,seen=new Set(),mode=null,alerts=[],wc=0,wseen={};
try{admin=sessionStorage.getItem("arn_admin")==="1"}catch(x){}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}
async function hash(s,salt){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function theme(){const r=document.documentElement;r.dataset.theme=getComputedStyle(r).colorScheme==="dark"?"light":"dark"}
async function init(){
 for(const[n,f]of[["db",v=>DB=v],["user",v=>U=v],["assets",v=>AS=v],["artifact",v=>AR=v],["room",v=>RM=v]])try{f(await claude.use(n))}catch(x){}
 draw();
 if(RM)RM.onPeers(ch=>{
  const v=ch.peers.filter(p=>!p.isMe&&p.kind==="viewer"&&p.presence.role==="guest");live=v.length;
  if(admin){ch.peers.filter(p=>!p.isMe&&p.kind==="viewer").forEach(p=>{
   if(p.presence.role==="guest"&&!seen.has(p.peer)){seen.add(p.peer);if(!baseline)newOpen()}
   const w=p.presence.wrong||0;if(w>(wseen[p.peer]||0)){wseen[p.peer]=w;if(!baseline)wrongAlert()}});baseline=false;stat()}},()=>{});
 if(admin&&DB)try{const s=await DB.doc("stats/openings").get();total=(s.data&&s.data()&&s.data().n)||0;const q=await DB.doc("stats/security").get();alerts=(q.data&&q.data()&&q.data().a)||[];stat()}catch(x){}
}
function wrongAlert(){alerts.unshift({t:new Date().toLocaleString()});alerts=alerts.slice(0,20);toast("Wrong login attempt on the Admin page");try{if(Notification.permission==="granted")new Notification("ARN Digital",{body:"Wrong admin login attempt."})}catch(x){}if(DB)DB.doc("stats/security").set({a:alerts}).catch(()=>{});stat()}
async function newOpen(){total++;fresh++;toast("New opening in your guest account");try{if(Notification.permission==="granted")new Notification("ARN Digital",{body:"Someone just opened your guest showcase."})}catch(x){}
 if(DB)try{await DB.doc("stats/openings").set({n:total,last:Date.now()})}catch(x){}stat()}
function stat(){if(!admin||$("lv")==null)return;if($("sec"))$("sec").innerHTML=alerts.map(a=>`<div class="si"><div><b>Wrong login</b><div class="lb">${e(a.t)}</div></div></div>`).join("")||`<p class="lb">No wrong login attempts.</p>`;$("lv").textContent=live;$("tt").textContent=total;$("fr").innerHTML=fresh?`<span class="badge">${fresh} new</span> <button class="btn g" onclick="fresh=0;stat()">Mark seen</button>`:"0"}
function draw(){if(admin&&!window.pv)return adminView();if(mode==="guest"||window.pv)return show();landing()}
function landing(){clearInterval(timer);$("app").innerHTML=`<div class="gate"><div class="card" style="width:min(460px,100%)"><div class="lg" style="justify-content:center;margin-bottom:6px"><i>A</i>ARN Digital</div><p class="lb">Choose how you want to continue.</p><p><button class="btn" style="width:100%;padding:14px" onclick="pickGuest()">Continue as Guest</button></p><p><button class="btn g" style="width:100%;padding:14px" onclick="login()">Admin</button></p></div></div>`}
function pickGuest(){mode="guest";if(RM)RM.presence({role:"guest",at:Date.now()}).catch(()=>{});draw()}
function show(){const s=DATA.sites;
 $("app").innerHTML=`<div class="show"><div class="hd"><div class="lg"><i>A</i>ARN Digital</div>${window.pv?`<button class="btn g" style="color:#fff" onclick="window.pv=0;draw()">Back to admin</button>`:`<button class="btn g" style="color:#fff;opacity:.7" onclick="mode=null;draw()">Home</button>`}</div>${s.length?s.map((x,i)=>`<div class="sl ${i===idx?"on":""}" style="${x.img?`background-image:url('/_blob/${e(x.img)}')`:"background-image:linear-gradient(135deg,#0b1a4a,#1d3fd6 55%,#6d5dfc)"}"><div><h2>${e(x.title)}</h2><p>${e(x.desc)}</p><a class="btn" href="${e(x.url)}" target="_blank" rel="noopener noreferrer">Visit website ↗</a></div></div>`).join(""):`<div class="sl on"><div><h2>Our work</h2><p>New websites are coming soon.</p></div></div>`}<div class="ctl"><button class="nb" onclick="go(-1)">‹</button>${s.map((_,i)=>`<button class="dt ${i===idx?"on":""}" onclick="idx=${i};upd()"></button>`).join("")}<button class="nb" onclick="go(1)">›</button><button class="nb" onclick="paused=!paused;this.textContent=paused?'▶':'❚❚'">❚❚</button></div></div>`;
 clearInterval(timer);timer=setInterval(()=>{if(!paused&&DATA.sites.length>1)go(1)},6000)}
function go(d){const n=DATA.sites.length;if(!n)return;idx=(idx+d+n)%n;upd()}
function upd(){document.querySelectorAll(".sl").forEach((el,i)=>el.classList.toggle("on",i===idx));document.querySelectorAll(".dt").forEach((el,i)=>el.classList.toggle("on",i===idx))}
document.addEventListener("keydown",ev=>{if(document.querySelector(".show")){if(ev.key==="ArrowRight")go(1);if(ev.key==="ArrowLeft")go(-1)}});
function login(){const first=!DATA.hash;clearInterval(timer);
 $("app").innerHTML=`<div class="gate"><div class="card"><div class="lg" style="justify-content:center;margin-bottom:12px"><i>A</i>ARN Digital</div><p class="lb">${first?"Create your owner password (min 6 characters).":"Owner password"}</p><input id="pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')enter()"><p><button class="btn" onclick="enter()">${first?"Set password":"Log in"}</button> <button class="btn g" onclick="mode=null;draw()">Back</button></p><p class="lb" id="er"></p></div></div>`}
async function enter(){const p=$("pw").value;
 if(!DATA.hash){if(p.length<6){$("er").textContent="Use at least 6 characters.";return}
  if(!(U&&(U.isOwner()||U.canEdit()))){$("er").textContent="Open this page signed in as the owner to set the password.";return}
  DATA.salt=crypto.randomUUID();DATA.hash=await hash(p,DATA.salt);try{sessionStorage.setItem("arn_admin","1")}catch(x){}if(!await save("Password set"))return;return}
 if(await hash(p,DATA.salt)!==DATA.hash){wc++;if(RM)RM.presence({wrong:wc,wat:Date.now()}).catch(()=>{});$("er").textContent="Incorrect password. The admin has been notified.";return}
 admin=true;try{sessionStorage.setItem("arn_admin","1")}catch(x){}init2()}
function init2(){draw();if(DB)DB.doc("stats/openings").get().then(s=>{total=(s.data&&s.data()&&s.data().n)||0;stat()}).catch(()=>{});baseline=true;if(RM)RM.presence({watching:null}).catch(()=>{})}
function logout(){admin=false;try{sessionStorage.removeItem("arn_admin")}catch(x){}draw()}
async function save(msg){try{if(!AR)throw{code:"unavailable"};const c=document.documentElement.cloneNode(true);c.removeAttribute("data-theme");c.querySelector("#app").innerHTML="";c.querySelectorAll(".toast").forEach(x=>x.remove());
 c.querySelector("#data").textContent=JSON.stringify(DATA).replace(/</g,"\\u003c");await AR.publish("<!DOCTYPE html>\n"+c.outerHTML);toast(msg||"Saved");return true}
 catch(x){toast(x&&x.code==="not_writer"||x&&x.code==="not_granted"?"Only the artifact owner or an editor can save changes.":"Could not save: "+(x&&(x.message||x.code)||"unknown"));return false}}
function adminView(){const s=DATA.sites;
 $("app").innerHTML=`<div class="top"><div class="lg"><i>A</i>ARN Digital <span class="lb" style="font-weight:400">Owner</span></div><div><button class="btn g" onclick="theme()">Theme</button> <button class="btn" onclick="window.pv=1;idx=0;draw()">Preview slideshow</button> <button class="btn g" onclick="logout()">Log out</button></div></div>
 <div class="wrap"><div class="stats"><div class="card"><div class="n" id="lv">${live}</div><div class="lb">Viewing right now</div></div><div class="card"><div class="n" id="tt">${total}</div><div class="lb">Openings counted</div></div><div class="card"><div class="n">${s.length}</div><div class="lb">Websites</div></div><div class="card"><div class="n" id="fr">${fresh?`<span class="badge">${fresh} new</span>`:"0"}</div><div class="lb">New since you looked</div></div></div>
 <div class="card"><b>Guest link</b><p class="lb">Anyone with this link sees the slideshow. Guests tap “Continue as Guest” on the first screen, with no password. Share the page by public link in the Share menu.</p><button class="btn g" onclick="navigator.clipboard.writeText(location.href).then(()=>toast('Link copied')).catch(()=>toast('Copy the address from your browser'))">Copy link</button> <button class="btn g" onclick="try{Notification.requestPermission().then(p=>toast('Alerts: '+p))}catch(x){}">Enable desktop alerts</button><p class="lb">Counts and alerts work while this admin page is open in your browser.</p></div>
 <div class="card"><b>Add a website</b><div class="row"><input id="st" placeholder="Website name"><input id="su" placeholder="https://example.com"></div><textarea id="sd" placeholder="Short description" style="min-height:70px;margin-bottom:10px"></textarea><div class="row"><input id="sf" type="file" accept="image/*"><button class="btn" onclick="addSite()">Add to slideshow</button></div><p class="lb">A screenshot makes a better slide. Guests get a button that opens the live site.</p></div>
 <div class="card"><b>Your websites</b>${s.map((x,i)=>`<div class="si">${x.img?`<img src="/_blob/${e(x.img)}" alt="">`:`<div class="ph"></div>`}<div><b>${e(x.title)}</b><div class="lb" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e(x.url)}</div></div><button class="btn g" onclick="mv(${i},-1)">↑</button><button class="btn g" onclick="delSite(${i})">Remove</button></div>`).join("")||`<p class="lb">None yet.</p>`}</div>
 <div class="card"><b>Security alerts</b><div id="sec"></div></div>
 <div class="card"><b>Change owner password</b><div class="row"><input id="np" type="password" placeholder="New password (min 6 characters)"><button class="btn" onclick="setPw()">Change</button></div></div></div>`;stat()}
async function setPw(){const p=$("np").value;if(p.length<6){toast("Use at least 6 characters");return}const o={...DATA};DATA.salt=crypto.randomUUID();DATA.hash=await hash(p,DATA.salt);if(!await save("Password changed"))DATA=o}
async function addSite(){const t=$("st").value.trim();let u=$("su").value.trim();if(!t||!u){toast("Name and link are required");return}if(!/^https?:\/\//i.test(u))u="https://"+u;try{new URL(u)}catch(x){toast("Invalid link");return}
 let img="";const f=$("sf").files[0];if(f&&AS){try{img=(await AS.upload(f)).id}catch(x){toast("Image upload failed")}}
 const o=DATA.sites.slice();DATA.sites.push({title:t,url:u,desc:$("sd").value.trim(),img});if(!await save("Website added"))DATA.sites=o}
async function delSite(i){if(!confirm("Remove this website?"))return;const o=DATA.sites.slice();DATA.sites.splice(i,1);if(!await save("Removed"))DATA.sites=o}
async function mv(i,d){const j=i+d;if(j<0||j>=DATA.sites.length)return;const o=DATA.sites.slice();[DATA.sites[i],DATA.sites[j]]=[DATA.sites[j],DATA.sites[i]];if(!await save())DATA.sites=o}
init();
</script>
</body></html>
